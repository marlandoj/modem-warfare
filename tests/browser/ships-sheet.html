<!doctype html>
<!-- SHIPS art sheet: every class, both orientations, every state, drawn by the
     real module (app/js/ships.js) under the real stylesheet (app/css/app.css).
     Test page only, served from the repo root by tools/serve.js; the ships
     gate screenshots it as evidence. Not part of the app, never precached. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Modem Warfare — ship art sheet</title>
  <link rel="stylesheet" href="../../app/css/app.css">
  <style>
    body { background: #061a2e; padding: 16px; }
    .sheet__row { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 18px; }
    .sheet__name { width: 150px; font-size: 12px; color: #ffb100; letter-spacing: .14em; padding-top: 30px; }
    .sheet__item { display: flex; flex-direction: column; gap: 6px; }
    .sheet__label { font-size: 10px; color: #8fb0bf; letter-spacing: .2em; }
    .sheet__ship { display: grid; grid-auto-rows: 64px; grid-auto-flow: column; grid-auto-columns: 64px; gap: 3px; padding: 5px; background: rgba(3,16,28,.7); border: 1px solid rgba(61,255,143,.28); border-radius: 10px; }
    .sheet__ship--v { grid-auto-flow: row; grid-auto-columns: 40px; grid-auto-rows: 40px; }
    .sheet__ship .cell { width: 100%; height: 100%; }
    h1 { font-size: 22px; }
  </style>
</head>
<body>
  <h1 class="stencil h2 h2--left">THE FLEET · SHIPS BUILD · ART SHEET</h1>
  <p class="hint" style="text-align:left">EVERY CLASS · HORIZONTAL (BOW RIGHT) IN EACH STATE · VERTICAL (BOW DOWN) · DRAWN BY app/js/ships.js UNDER app/css/app.css</p>
  <div id="sheet"></div>
  <script type="module">
    import { segmentSvg } from '../../app/js/ships.js';
    const SIZES = [4, 3, 2, 2];
    const NAMES = ['4-SHIP · CAPITAL (BATTLESHIP)', '3-SHIP · CRUISER', '2-SHIP · DESTROYER', '2-SHIP · CORVETTE'];
    const STATES = [['intact', ''], ['one hit', 'cell--hit'], ['sunk (settled wreck)', 'cell--hit cell--sunk cell--settled']];
    let out = '';
    SIZES.forEach((size, i) => {
      out += `<div class="sheet__row"><div class="sheet__name">${NAMES[i]}</div>`;
      for (const [label, classes] of STATES) {
        out += `<div class="sheet__item"><div class="sheet__label">${label}</div><div class="sheet__ship">`;
        for (let k = 0; k < size; k++) {
          const cls = label === 'one hit' ? (k === (size === 2 ? 0 : 1) ? 'cell--hit' : '') : classes;
          out += `<div class="cell cell--ship ${cls}">${segmentSvg({ shipIndex: i, size, k, horizontal: true })}</div>`;
        }
        out += '</div></div>';
      }
      out += '<div class="sheet__item"><div class="sheet__label">vertical</div><div class="sheet__ship sheet__ship--v">';
      for (let k = 0; k < size; k++) out += `<div class="cell cell--ship">${segmentSvg({ shipIndex: i, size, k, horizontal: false })}</div>`;
      out += '</div></div></div>';
    });
    document.getElementById('sheet').innerHTML = out;
    document.body.dataset.sheetReady = '1';
  </script>
</body>
</html>
