  - the shell CSP is byte-identical to Tuesday's (asserted in tests/browser/sonar.js)
done_when:
  - ggwave loads in the app with zero console errors under the unchanged policy
  - LISTEN reports capture 'worklet'; CHIRP closes and reopens the mic
